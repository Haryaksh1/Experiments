# All model/runtime values live here; CLI flags override them.
model: phi3:mini
host: http://127.0.0.1:11434
temperature: 0.7          # actors (agents that must vary across seeds)
judge_temperature: 0.1    # judges, scorers, summarizers
num_ctx: 4096             # phi3:mini default context; set explicitly on every call
max_tokens: 512           # default cap on generated tokens; calls may pass a smaller one
seed: 0
num_thread: 4             # CPU threads for inference; kept low so the laptop stays cool
keep_alive: 5m            # unload the model from RAM 5 minutes after the last call
max_retries: 2            # validation retries (and transport retries) per call
budget_margin: 0.10       # safety margin on the prompt budget
chars_per_token: 2.3      # pre-call token estimate; bench measured 2.35-2.56 for phi3 (digits tokenize finely)
