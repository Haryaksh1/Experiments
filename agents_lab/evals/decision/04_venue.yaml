id: venue
question: Which venue should host a 400-person industry conference?
options: [Hotel Central, Expo Hall, University Campus]
criteria:
  - {name: cost, weight: 0.30, description: lower total cost is better}
  - {name: capacity_fit, weight: 0.25, description: capacity close to 400 without being cramped or empty is better}
  - {name: accessibility, weight: 0.25, description: easier to reach by public transport is better}
  - {name: amenities, weight: 0.20, description: included catering and AV equipment are better}
facts:
  - Hotel Central costs $60,000, holds 450 people, is 5 minutes from the main train station and includes catering and AV.
  - Expo Hall costs $45,000 plus $10,000 for catering, holds 1,200 people and is 25 minutes from the station by shuttle.
  - University Campus costs $30,000, holds 420 people and is a 10-minute walk from the station.
  - University Campus has basic AV only; catering comes from the student union at extra cost of $5,000.
uncertainties:
  - Final attendance could be 10% higher or lower.
constraints:
  - Total budget is $70,000.
reference: {best: Hotel Central, dominated: [], category: close}
